name: Build Latigo Student (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Nuitka build cache
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Nuitka\Cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt', 'build.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard imageio pillow

      - name: Build with Nuitka (No Obfuscation)
        run: python build.py
        env:
          NUITKA_JOBS: 2
          NUITKA_PYTHON_EXE: python

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: LatigoStudent-Windows-Portable
          path: dist/main.dist/
          retention-days: 7

      - name: Zip distribution
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          Compress-Archive -Path dist\main.dist\* -DestinationPath LatigoStudent-Windows.zip

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LatigoStudent-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}